name: Atualizar dados do hub

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # a cada 30 min no horário de pregão (horário UTC)
    - cron: "0 10 * * *"           # uma vez por dia, inclusive fim de semana
  workflow_dispatch:                # botão para rodar na mão

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Os arquivos das empresas ficam guardados entre uma execução e outra (sem ir para o histórico do Git)
      - uses: actions/cache@v4
        with:
          path: data/empresas
          key: empresas-${{ github.run_id }}
          restore-keys: empresas-
      - run: python coletor.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Salvar dados no repositório
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add data/hub.json
          git diff --cached --quiet || (git commit -m "Atualiza dados" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
